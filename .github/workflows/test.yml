name: Tests
 
on:
  pull_request:
    branches: ['*']
  push:
    branches: ['devin/1767740595-betanalytics-app', 'main', 'master']
 
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
 
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
 
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
 
      - name: Run tests
        run: pnpm test
